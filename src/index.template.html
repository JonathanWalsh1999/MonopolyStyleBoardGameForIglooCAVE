<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campus Tycoon – Igloo CAVE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#E8B84A;--green:#34D399;--red:#F87171;--ink:#0a0f1c;--glass:rgba(14,22,44,.86);--line:rgba(255,255,255,.14);--txt:#E8ECF8;--muted:#9AA6C8}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Inter',Arial,sans-serif;color:var(--txt)}
#stage{position:absolute;left:0;top:0;width:12566px;height:4516px;transform-origin:0 0}
.wall{position:absolute;top:0;height:1080px;background:linear-gradient(#05070f 0%,#0b1630 60%,#122247 100%)}
#sky{position:absolute;left:0;top:0;width:12566px;height:1080px}
#floor{position:absolute;left:3436px;top:1080px;width:2847px;height:3436px;overflow:hidden;background:#070b16}
#fx{position:absolute;left:0;top:0;width:12566px;height:1080px;pointer-events:none;z-index:50}
h2,.mont{font-family:'Montserrat',Arial,sans-serif}
/* board */
.sq{position:absolute;top:0;height:380px;box-sizing:border-box;border-right:4px solid #05070f;border-bottom:4px solid var(--gold);background:#131c33;color:var(--txt);overflow:hidden}
.sq .strip{height:70px;font:700 28px Montserrat,Arial;padding:18px 14px 0;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.sq .nm{padding:12px 14px 0;font:700 38px Montserrat,Arial;line-height:1.08;height:112px;overflow:hidden;box-sizing:border-box}
.sq .pr{padding:0 14px;font:600 32px Inter,Arial;height:36px;color:var(--gold)}
.sq .tok{position:absolute;left:8px;right:8px;top:224px;height:88px;display:flex;align-items:flex-end}
.tk{width:80px;height:80px;flex:0 0 80px;margin-right:-18px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.tk svg,.tk img{width:100%;height:100%;object-fit:contain}
.tk.locked{outline:8px solid #F87171;border-radius:22px;background:rgba(248,113,113,.25)}
.sq .rn.hi{color:#34D399}.sq .rn.lo{color:#9CA3AF}
.tk.hop{animation:hop .25s ease-out}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-56px)}100%{transform:translateY(0)}}
.sq .own{position:absolute;left:0;right:0;bottom:0;height:64px;font:700 26px Montserrat,Arial;padding:16px 14px;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.sq.corner{background:linear-gradient(160deg,#F4D27A,#C8932E);color:#1a1405}
.sq.special{background:#1b2747}
.sq.cur{box-shadow:inset 0 0 0 10px var(--gold)}
.sq.flash{animation:sqflash .9s ease-out}
@keyframes sqflash{0%{filter:brightness(2)}100%{filter:brightness(1)}}
.sq .big{padding:26px 14px 0;font:800 42px Montserrat,Arial;line-height:1.05}
.sq .sub{padding:10px 14px 0;font-size:28px;line-height:1.2;opacity:.85}
#ticker{position:absolute;left:0;top:384px;width:12566px;height:36px;overflow:hidden;background:#05070f;border-bottom:2px solid var(--line);z-index:5}
#tickin{position:absolute;left:0;top:2px;white-space:nowrap;font:600 28px Inter,Arial;animation:tick 140s linear infinite}
#tickin span{margin-right:70px}.up{color:var(--green)}.dn{color:var(--red)}.gd{color:var(--gold)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* panels */
.panel{position:absolute;top:440px;background:var(--glass);border:2px solid var(--line);border-radius:24px;box-sizing:border-box;padding:26px 34px;overflow:hidden}
.panel h2{margin:0 0 12px;font:800 34px Montserrat,Arial;color:var(--gold);text-transform:uppercase;letter-spacing:3px}
.team{width:800px;height:600px;padding:22px 26px}
.team .row{display:flex;gap:22px;align-items:center}
.team .av{width:190px;height:190px;flex:0 0 190px}
.team .av svg,.team .av img{width:100%;height:100%;object-fit:contain}
.team .tname{font:800 52px Montserrat,Arial;line-height:1}
.team .tag{font-size:26px;color:var(--muted);margin-top:6px}
.team .money{font:800 92px Montserrat,Arial;margin:16px 0 0;color:var(--green);font-variant-numeric:tabular-nums}
.team .stat{font-size:30px;color:var(--muted)}
.team .chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 24px Montserrat,Arial;padding:5px 12px;border-radius:8px;color:#0a0f1c}
.team.active{border-color:var(--gold);box-shadow:0 0 0 6px var(--gold),0 0 60px rgba(232,184,74,.45)}
.team.empty{opacity:.18}
.jailtag{display:inline-block;margin-top:10px;background:var(--red);color:#1a0505;font:800 28px Montserrat,Arial;padding:6px 14px;border-radius:8px}
.money.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.15)}}
.mini{display:inline-block;width:76px;height:76px;flex:0 0 76px;vertical-align:middle}
.mini svg,.mini img{width:100%;height:100%;object-fit:contain}
.dock{position:absolute;top:880px;height:180px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px}
.btn{font:700 46px Montserrat,Arial;border:none;border-radius:16px;padding:0 40px;height:140px;cursor:pointer;background:var(--gold);color:#16120a;box-shadow:0 6px 0 rgba(0,0,0,.5)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.5)}
.dock.many .btn{font-size:32px;height:76px;padding:0 22px;border-radius:12px}
.btn.go{background:#22C55E;color:#04170b}.btn.no{background:#EF4444;color:#fff}.btn.alt{background:#3B82F6;color:#fff}.btn.off{background:#2b3553;color:#7d88a8;cursor:default}
.btn.sm{font-size:30px;height:72px;padding:0 22px;border-radius:12px}
.btn.num{width:104px;padding:0;font-size:44px}
#turn .who{font:800 56px Montserrat,Arial;display:flex;align-items:center;gap:20px}
#turn .who .mini{width:100px;height:100px;flex-basis:100px}
#dice{display:flex;gap:50px;margin:14px 0 12px 20px;perspective:1200px}
.cube{width:124px;height:124px;position:relative;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.8,.25,1)}
.face{position:absolute;width:124px;height:124px;background:#F5F1E6;border-radius:18px;border:3px solid #d6cfbd;box-sizing:border-box;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px}
.face i{width:24px;height:24px;border-radius:50%;background:#16120a;place-self:center}
.f1{transform:translateZ(62px)}.f2{transform:rotateY(90deg) translateZ(62px)}.f3{transform:rotateY(180deg) translateZ(62px)}
.f4{transform:rotateY(-90deg) translateZ(62px)}.f5{transform:rotateX(90deg) translateZ(62px)}.f6{transform:rotateX(-90deg) translateZ(62px)}
#msg{font-size:38px;line-height:1.25;color:var(--txt)}
#qcard{background:#0b1222;border-color:var(--gold)}
#qcard.flip{animation:flip .55s cubic-bezier(.2,.9,.3,1.15)}
@keyframes flip{0%{transform:perspective(2500px) rotateX(-80deg);opacity:0}100%{transform:perspective(2500px) rotateX(0);opacity:1}}
#qcard .qh{font:800 30px Montserrat,Arial;color:var(--gold);margin-bottom:10px;text-transform:uppercase;letter-spacing:2px}
#qcard .qq{font:700 52px Montserrat,Arial;line-height:1.15;margin-bottom:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{background:#16203a;border:3px solid #33415f;border-radius:14px;padding:12px 18px;font-size:34px;cursor:pointer;line-height:1.15;display:flex;gap:16px;align-items:center}
.opt b{flex:0 0 auto;font-family:Montserrat;color:var(--gold)}
.opt.right{background:#0f3d2a;border-color:var(--green)}
.opt.wrong{background:#4a1616;border-color:var(--red);animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.exp{margin-top:14px;font-size:30px;line-height:1.25;color:var(--muted)}
.feed div{font-size:30px;line-height:1.25;padding:8px 0;border-bottom:1px solid var(--line)}
.lb-row{display:flex;align-items:center;gap:20px;font:700 42px Montserrat,Arial;padding:6px 0;border-bottom:1px solid var(--line)}
.lb-row .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .v{color:var(--green);font-variant-numeric:tabular-nums}
.lb-row .s{font:400 28px Inter,Arial;color:var(--muted);width:290px;text-align:right}
#timer .t{font:800 96px Montserrat,Arial;line-height:1;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
.hrow{display:flex;align-items:center;gap:10px;font-size:25px;margin:3px 0}
.hrow span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar{flex:0 0 130px;height:12px;background:#24304f;border-radius:6px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--gold)}
.hide{display:none!important}
.setrow{font-size:36px;margin:14px 0 10px;color:var(--muted)}
.pick{display:flex;gap:12px}
.co{width:200px;height:250px;border-radius:18px;background:#16203a;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 8px 12px;box-sizing:border-box;position:relative;border:4px solid transparent;text-align:center}
.co .mini{width:140px;height:140px;flex-basis:140px;margin-bottom:8px}
.co b{font:800 28px Montserrat,Arial;line-height:1.05}
.co.on{border-color:var(--gold);background:#2a2614}
.co .ord{position:absolute;top:8px;left:8px;width:50px;height:50px;border-radius:50%;background:var(--gold);color:#16120a;font:800 32px Montserrat,Arial;display:flex;align-items:center;justify-content:center}
#citycv{position:absolute;left:0;top:0}
#floormon{position:absolute;left:723px;top:1018px;width:1400px;height:1400px;opacity:.92;transition:filter .4s}
#floormon svg,#floormon img{width:100%;height:100%;object-fit:contain}
#floormon.idle{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04)}}
#floormon.joy{animation:rise .9s ease-out;filter:drop-shadow(0 0 120px #34D399)}
@keyframes rise{40%{transform:scale(1.15) translateY(-80px)}}
#floormon.sad{animation:fall 1.2s ease-out;filter:grayscale(.8) drop-shadow(0 0 120px #F87171)}
@keyframes fall{40%{transform:scale(.9) translateY(80px) rotate(-3deg)}}
#floormsg{position:absolute;left:0;width:2847px;top:2500px;text-align:center;font:800 260px Montserrat,Arial;opacity:0}
#floormsg.show{animation:fmsg 2.2s ease-out}
@keyframes fmsg{0%{opacity:0;transform:translateY(120px)}20%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0}}
.pop{position:absolute;z-index:60;font:800 110px Montserrat,Arial;pointer-events:none;-webkit-text-stroke:5px #05070f;paint-order:stroke fill;animation:popup 1.8s ease-out forwards}
@keyframes popup{0%{transform:translateY(40px);opacity:0}15%{transform:translateY(0);opacity:1}100%{transform:translateY(-240px);opacity:0}}
#banner{position:absolute;left:3436px;top:0;width:2847px;height:1080px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:70}
#banner div{font:800 190px Montserrat,Arial;color:var(--gold);-webkit-text-stroke:8px #05070f;paint-order:stroke fill;animation:banner 2.4s ease-out forwards;text-align:center;line-height:1;letter-spacing:4px}
@keyframes banner{0%{transform:scale(1.6);opacity:0;letter-spacing:60px}18%{transform:scale(1);opacity:1;letter-spacing:4px}85%{opacity:1}100%{opacity:0}}
#intro{position:absolute;left:0;top:0;width:12566px;height:4516px;z-index:85;pointer-events:none}
.iw{position:absolute;top:0;height:1080px;background:rgba(3,5,12,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;padding:40px;overflow:hidden}
#ifloor{position:absolute;left:3436px;top:1080px;width:2847px;height:3436px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(3,5,12,.55)}
.it{font:800 150px Montserrat,Arial;color:#fff;line-height:1.05;letter-spacing:2px}.it.gold{color:var(--gold)}.it.grn{color:var(--green)}.it.red{color:var(--red)}
.is{font:600 60px Inter,Arial;color:var(--muted);margin-top:24px;line-height:1.25}
.in{animation:inz .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes inz{0%{transform:scale(1.5);opacity:0;filter:blur(24px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
#iskip{position:absolute;left:5900px;top:960px;pointer-events:auto;z-index:90}
.qclock{float:right;font:800 64px Montserrat,Arial;color:var(--gold);margin-top:-14px;font-variant-numeric:tabular-nums}
.qclock.low{color:var(--red);animation:bump .5s infinite}
.loancol{display:inline-block;vertical-align:top;width:1200px;margin:0 40px}
</style>
</head>

<script>
const SAMPLE = /*__SAMPLE_DATA__*/null;

const WALLS=[{x:0,w:3436},{x:3436,w:2847},{x:6283,w:3436},{x:9719,w:2847}];
const UNITCOL=['','#C0703A','#4FC3F7','#F48FB1','#FFA726','#EF5350','#FFEE58','#66BB6A','#7C8CF0'];
const UNITTXT=['','#fff','#0b2533','#3a0d1f','#2b1600','#fff','#2b2600','#0d230e','#0a0f2c'];
/* parody companies – original logos, names that nod to familiar brands */
const COMPANIES=[
 {id:'amazoom',name:'Amazoom',code:'AMZM',tag:'Delivered before you ordered it',color:'#F59E0B'},
 {id:'costalot',name:'Costalot Coffee',code:'CSTL',tag:'Premium beans. Premium prices.',color:'#B4233A'},
 {id:'greggles',name:'Greggles',code:'GRGL',tag:'Baked fresh. Eaten faster.',color:'#1D4ED8'},
 {id:'toktik',name:'TokTik',code:'TOKT',tag:'Content for 15 seconds',color:'#DB2777'},
 {id:'primarket',name:'Primarket',code:'PRMK',tag:'Cheap as chips. Chips extra.',color:'#0891B2'},
 {id:'nandoughs',name:'Nandoughs',code:'NAND',tag:'Extra hot takes',color:'#65A30D'}];
const BOARD=[
 {t:'go'},{t:'prop',u:1,c:'1A'},{t:'real'},{t:'prop',u:1,c:'1B'},{t:'life'},{t:'hub',c:'HUB1'},{t:'prop',u:2,c:'2A'},{t:'pop'},{t:'prop',u:2,c:'2B'},{t:'prop',u:2,c:'2C'},
 {t:'jail'},{t:'prop',u:3,c:'3A'},{t:'util',c:'MATHS'},{t:'prop',u:3,c:'3B'},{t:'prop',u:3,c:'3C'},{t:'hub',c:'HUB2'},{t:'prop',u:4,c:'4A'},{t:'real'},{t:'prop',u:4,c:'4B'},{t:'prop',u:4,c:'4C'},
 {t:'bonus'},{t:'prop',u:5,c:'5A'},{t:'pop'},{t:'prop',u:5,c:'5B'},{t:'prop',u:5,c:'5C'},{t:'hub',c:'HUB3'},{t:'prop',u:6,c:'6A'},{t:'prop',u:6,c:'6B'},{t:'util',c:'ENGLISH'},{t:'prop',u:6,c:'6C'},
 {t:'gojail'},{t:'prop',u:7,c:'7A'},{t:'prop',u:7,c:'7B'},{t:'real'},{t:'prop',u:7,c:'7C'},{t:'hub',c:'HUB4'},{t:'life'},{t:'prop',u:8,c:'8A'},{t:'life'},{t:'prop',u:8,c:'8B'}];
/* v8 economy: £400–£800. Base rent is a wildcard – some squares are cheap with high rent, some are trophy buys with low rent */
const PR={'1A':[400,60],'1B':[420,20],'2A':[450,45],'2B':[450,90],'2C':[500,25],'3A':[500,50],'3B':[520,100],'3C':[550,30],'4A':[560,55],'4B':[580,30],'4C':[600,120],
  '5A':[620,60],'5B':[640,130],'5C':[650,35],'6A':[680,70],'6B':[700,35],'6C':[720,140],'7A':[740,75],'7B':[760,150],'7C':[780,40],'8A':[790,80],'8B':[800,170]};
const HMULT=[1,3,6,10,13,16];
const rentTable=c=>HMULT.map(m=>PR[c][1]*m);
const rentKind=c=>{const r=PR[c][1]/PR[c][0];return r>=.15?'hi':r<=.06?'lo':''};
const HOUSE={1:150,2:150,3:200,4:200,5:250,6:250,7:300,8:300};
const HUB_PRICE=500,HUB_RENT=[50,100,150,250],UTIL_PRICE=450;
/* Life Happens cards: bills go into the Jackpot. If you can't pay, an automatic payday loan covers it. */
const LIFE=[
 {bad:1,tax:1,t:'HMRC tax bill',d:'20% of your cash',f:t=>Math.max(200,Math.round(t.money*.2/10)*10)},
 {bad:1,t:'The boiler broke',d:'Emergency engineer, weekend rates',f:()=>600},
 {bad:1,t:'Speeding fine',d:'The camera never lies',f:()=>400},
 {bad:1,t:'Cracked phone screen',d:'Dropped it. Again.',f:()=>250},
 {bad:1,t:'Council tax bill',d:'Bins don\'t empty themselves',f:()=>300},
 {bad:1,t:'Van failed its MOT',d:'Brakes, tyres, the lot',f:()=>500},
 {bad:0,t:'Tax refund',d:'HMRC owed YOU for once',f:()=>300},
 {bad:0,t:'Your post went viral',d:'Brand deal incoming',f:()=>400},
 {bad:0,t:'Sold old trainers online',d:'One person\'s junk…',f:()=>150}];
const KIND_TOPIC={pop:'POPQUIZ',real:'REALWORLD',jail:'REVISION',bonus:'BONUS'};
const JAIL_TRIES=3;
const ANSWER_SECS=60;
const LOAN={bank:{rate:.10,name:'Bank loan'},payday:{rate:.40,name:'Payday loan'}};

let BANK=JSON.parse(JSON.stringify(SAMPLE));
let BANKSRC='Built-in sample questions';
let S={phase:'setup',picked:['amazoom','costalot','greggles','toktik'],minutes:BANK.settings.minutes||60,teams:[],cur:0,own:{},pot:0,dice:[1,1],msg:'',feed:[],log:[],used:new Set(),lastQ:{},lifeDeck:[],life:null,timeLeft:0,running:false,timeUp:false,q:null,kind:null,ctx:null,actA:[],actB:[],landed:null,busy:false,hopper:-1,round:1,finalRound:false,qLeft:0,introOn:false};

const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=c=>BANK.names[c]||c;
const money=v=>'£'+Math.round(v).toLocaleString('en-GB');
const coById=id=>COMPANIES.find(m=>m.id===id);

/* ---------- company logos (drawn in code; PNGs in assets/logos override them) ---------- */
const IMG={};
COMPANIES.forEach(m=>{const im=new Image();im.onload=()=>{IMG[m.id]=im.src;refreshLogos()};im.src=`assets/logos/${m.id}.png`});
let refreshT=0;function refreshLogos(){clearTimeout(refreshT);refreshT=setTimeout(()=>{buildBoard();render()},200)}

/* ---------- sound: ElevenLabs clips in assets/audio, with built-in fallbacks ---------- */
const SFX=['sfx_dice','sfx_hop','sfx_coins','sfx_correct','sfx_wrong','sfx_card','sfx_fanfare','sfx_jail','sfx_build','sfx_happy','sfx_sad','sfx_ooh','sfx_thinking','sfx_slam','sfx_riser','sfx_tick','sfx_timeup','sfx_crowd'];
const V=(b,n)=>[b].concat(Array.from({length:n-1},(_,i)=>b+'_'+(i+2)));
const HOST={welcome:['host_welcome'],buy:['host_buy_1','host_buy_2','host_buy_3','host_buy_4','host_buy_5'],wrong:['host_wrong_1','host_wrong_2','host_wrong_3','host_wrong_4','host_wrong_5'],
  chicken:V('host_chicken',3),rent:V('host_rent',3),cwon:V('host_challenge_won',3),clost:V('host_challenge_lost',3),pop:V('host_popquiz',3),real:V('host_realworld',3),
  bonus:V('host_bonus',2),revision:V('host_revision',2),escape:V('host_escape',2),go:V('host_go',3),house:V('host_house',3),hotel:V('host_hotel',2),late:V('host_latefee',2),
  timeup:['host_timeup'],jackpot:['host_jackpot_1','host_jackpot_2'],timeout:['host_timeout_1','host_timeout_2'],payday:['host_payday_1','host_payday_2'],
  bankok:['host_bank_ok'],bankno:['host_bank_no'],interest:['host_interest'],repay:['host_repay'],finalround:['host_finalround'],
  taxman:['host_event_bad_1'],eventbad:['host_event_bad_2','host_event_bad_3'],eventgood:['host_event_good_1','host_event_good_2'],autoloan:['host_autoloan']};
const ANYTURN=['host_turn_any_1','host_turn_any_2','host_turn_any_3','host_turn_any_4'];
COMPANIES.forEach(m=>{HOST['turn_'+m.id]=V('host_turn_'+m.id,3).concat(ANYTURN);HOST['win_'+m.id]=['host_win_'+m.id]});
const INTRO=['intro_1','intro_3','intro_4','intro_4b','intro_5','intro_6','intro_7','intro_8','intro_9'].concat(COMPANIES.map(c=>'intro_co_'+c.id));
const AUD={},OK={};let muted=false,hostNow=null,loopNow=null,actx=null;
[...SFX,...Object.values(HOST).flat(),...INTRO].forEach(k=>{const a=new Audio();a.preload='auto';a.oncanplaythrough=()=>OK[k]=1;a.onerror=()=>OK[k]=0;a.src=`assets/audio/${k}.mp3`;AUD[k]=a});
function ac(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}return actx}
function beep(freqs,dur=.12,type='triangle',vol=.25){if(muted||!ac())return;let t=actx.currentTime;
  freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);t+=dur*.8})}
const FALLBACK={sfx_dice:()=>beep([300,250,320,280,350],.06,'square',.1),sfx_hop:()=>beep([1200],.03,'sine',.12),sfx_coins:()=>beep([988,1319],.12,'square',.12),sfx_correct:()=>beep([523,659,784,1047],.12),
  sfx_wrong:()=>beep([196,147],.3,'sawtooth',.15),sfx_card:()=>beep([400,800],.08,'sine'),sfx_fanfare:()=>beep([523,659,784,1047,784,1047],.18,'square',.12),sfx_jail:()=>beep([392,370,349,330],.3,'sawtooth',.12),sfx_build:()=>beep([600,600,600,1200],.07,'square',.1)};
function talking(){return hostNow&&!hostNow.paused&&!hostNow.ended}
function play(k,{vol=.8,max=0,loop=false}={}){if(muted)return null;if(!loop&&talking())vol*=.45;
  if(OK[k]===0||!AUD[k]){FALLBACK[k]&&FALLBACK[k]();return null}
  const a=loop?AUD[k]:AUD[k].cloneNode();a.volume=vol;a.loop=loop;a.currentTime=0;a.play().catch(()=>{FALLBACK[k]&&FALLBACK[k]()});
  if(max)setTimeout(()=>{a.pause()},max*1000);return a}
/* host lines: never repeat a recent line, and stay quiet sometimes on routine moments (chance < 1) */
const RECENT=[];
function host(ev,delay=0,chance=1){const list=HOST[ev];if(!list||Math.random()>chance)return;setTimeout(()=>{if(muted)return;
  let pool=list.filter(k=>OK[k]&&!RECENT.includes(k));if(!pool.length)pool=list.filter(k=>OK[k]);if(!pool.length)return;
  const k=pool[rnd(pool.length)];RECENT.push(k);if(RECENT.length>14)RECENT.shift();
  if(hostNow){hostNow.pause()}hostNow=AUD[k];hostNow.currentTime=0;hostNow.volume=1;duck(true);hostNow.onended=()=>duck(S.phase==='question');hostNow.play().catch(()=>{})},delay)}
function clip(k){return new Promise(res=>{if(muted||!OK[k]){setTimeout(()=>res(2.2),2200);return}
  if(hostNow)hostNow.pause();const a=AUD[k];hostNow=a;a.currentTime=0;a.volume=1;a.playbackRate=INTRO_RATE;duck(true);let done=false;const fin=()=>{if(!done){done=true;res(a.duration||2)}};
  a.onended=fin;a.play().catch(fin);setTimeout(fin,22000)})}
function thinking(on){if(on){duck(true);if(!loopNow){loopNow=play('sfx_thinking',{vol:.12,loop:true})}}else{if(loopNow){loopNow.pause();loopNow=null}duck(false)}}
function cheer(ok){if(ok){play('sfx_correct');play('sfx_happy',{vol:.45,max:2.4})}else{play('sfx_wrong');play('sfx_sad',{vol:.45,max:2.4})}}

/* ---------- background music: generative lo-fi city loop (no file needed) ---------- */
const MUS={on:true,gain:null,bus:null,next:0,step:0,timer:0,noise:null,base:.2};
const CHORDS=[[57,60,64,67,71],[53,57,60,64,67],[48,52,55,59,62],[55,59,62,65,69]];
const PENTA=[69,72,74,76,79,81];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function startMusic(){if(!MUS.on||muted||MUS.gain||!ac())return;
  MUS.gain=actx.createGain();MUS.gain.gain.value=.0001;MUS.gain.connect(actx.destination);
  MUS.bus=actx.createBiquadFilter();MUS.bus.type='lowpass';MUS.bus.frequency.value=2400;MUS.bus.connect(MUS.gain);
  const n=actx.createBuffer(1,actx.sampleRate,actx.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;MUS.noise=n;
  MUS.gain.gain.setTargetAtTime(MUS.base,actx.currentTime,1.5);MUS.next=actx.currentTime+.15;MUS.step=0;MUS.timer=setInterval(schedMusic,50)}
function stopMusic(){if(!MUS.gain)return;clearInterval(MUS.timer);const g=MUS.gain;g.gain.setTargetAtTime(.0001,actx.currentTime,.3);setTimeout(()=>g.disconnect(),1500);MUS.gain=null}
function duck(on){if(MUS.gain)MUS.gain.gain.setTargetAtTime(on?MUS.base*.12:MUS.base,actx.currentTime,.35)}
function schedMusic(){const spb=60/78/2;while(MUS.next<actx.currentTime+.35){musStep(MUS.step,MUS.next+(MUS.step%2?spb*.18:0));MUS.next+=spb;MUS.step++}}
function tone(f,t,dur,vol,type='triangle',det=0){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;o.detune.value=det;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.4,dur*.3));g.gain.setTargetAtTime(.0001,t+dur*.7,dur*.25);o.connect(g).connect(MUS.bus);o.start(t);o.stop(t+dur*1.6)}
function hit(t,vol,f0,f1,dur,noise,hp){if(noise){const s=actx.createBufferSource();s.buffer=MUS.noise;const fl=actx.createBiquadFilter();fl.type=hp?'highpass':'bandpass';fl.frequency.value=hp?7000:1800;
    const g=actx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl).connect(g).connect(MUS.gain);s.start(t);s.stop(t+dur);return}
  const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MUS.gain);o.start(t);o.stop(t+dur)}
function musStep(s,t){const b=s%8,ch=CHORDS[Math.floor(s/8)%4],bar=60/78*4;
  if(b===0)ch.forEach((m,i)=>{tone(mtof(m),t,bar,.045,i%2?'sine':'triangle',i*4-8)});
  if(b===0||b===3||b===6)tone(mtof(ch[0]-24),t,.5,.16,'sine');
  if(b===0||b===5)hit(t,.55,120,45,.35);
  if(b===2||b===6)hit(t,.12,0,0,.18,true);
  hit(t,b%2?.035:.05,0,0,.05,true,true);
  if(b%2&&Math.random()<.32)tone(mtof(PENTA[rnd(PENTA.length)]),t,.6,.05,'sine')}
addEventListener('pointerdown',()=>{ac();startMusic()},{once:true});

/* ---------- board helpers ---------- */
function sqGeom(i){const w=WALLS[Math.floor(i/10)],k=i%10,sw=w.w/10;return {left:w.x+k*sw,width:sw}}
function label(i){const b=BOARD[i];return ['prop','hub','util'].includes(b.t)?nm(b.c):''}
function longLabel(i){const b=BOARD[i];if(b.t==='prop')return `Unit ${b.u} (${nm('U'+b.u)}): ${nm(b.c)}`;if(b.t==='hub')return `Skills hub: ${nm(b.c)}`;if(b.t==='util')return nm(b.c);return ''}
function price(i){const b=BOARD[i];return b.t==='prop'?PR[b.c][0]:b.t==='hub'?HUB_PRICE:b.t==='util'?UTIL_PRICE:0}
function baseRent(i){const b=BOARD[i];return b.t==='prop'?PR[b.c][1]:b.t==='hub'?HUB_RENT[0]:0}
function unitSquares(u){return BOARD.map((b,i)=>b.u===u?i:-1).filter(i=>i>=0)}
function ownsSet(team,u){return unitSquares(u).every(i=>S.own[i]&&S.own[i].team===team)}
function rent(i){const o=S.own[i],b=BOARD[i];
  if(b.t==='prop'){const r=rentTable(b.c);return o.houses?r[o.houses]:(ownsSet(o.team,b.u)?r[0]*2:r[0])}
  if(b.t==='hub'){const n=BOARD.filter((x,j)=>x.t==='hub'&&S.own[j]&&S.own[j].team===o.team).length;return HUB_RENT[n-1]}
  const both=BOARD.every((x,j)=>x.t!=='util'||(S.own[j]&&S.own[j].team===o.team));return (S.dice[0]+S.dice[1])*(both?20:8)}
function catOf(i){const b=BOARD[i];return b.t==='prop'?'U'+b.u:b.t==='hub'?'HUB':b.c}
const CATS=['U1','U2','U3','U4','U5','U6','U7','U8','HUB','MATHS','ENGLISH','POP','REAL','BONUS'];
function catName(c){return c[0]==='U'&&c.length===2?`U${c[1]} ${nm(c)}`:{HUB:'Skills hubs',MATHS:'Maths',ENGLISH:'English',POP:'Pop quiz',REAL:'Real world',BONUS:'Bonus round'}[c]}

/* ---------- questions ---------- */
function pickQ(chain,avoid){
  const pools=chain.map(([topic,lvl])=>BANK.questions.filter(q=>q.topic===topic&&(lvl==null||q.level===lvl)&&q.id!==avoid)).filter(p=>p.length);
  if(!pools.length)return null;
  for(const p of pools){const fresh=p.filter(q=>!S.used.has(q.id));if(fresh.length){const q=fresh[rnd(fresh.length)];S.used.add(q.id);return q}}
  const p=pools[0];p.forEach(q=>S.used.delete(q.id));const q=p[rnd(p.length)];S.used.add(q.id);return q}
function chainFor(i,lvl){const b=BOARD[i];
  if(b.t==='prop')return [[b.c,lvl],['U'+b.u,lvl],[b.c,null],['U'+b.u,null],['ANY',null]];
  if(b.t==='hub')return [[b.c,null],['HUB',null],['ANY',null]];
  return [[b.c,null],['ANY',null]]}
function teachBack(i){return {id:'teach'+i,q:`Teach it back. In 60 seconds, explain "${nm(BOARD[i].c)}" to the rest of the room.`,opts:[],ans:'',exp:'Tutor decides: was it clear and accurate? Other teams can help judge.'}}

const fx=$('fx'),fc=fx.getContext('2d'),conf=[];
const MONEYCOL=['#E8B84A','#F4D27A','#34D399','#A7F3D0','#ffffff'];
function burstAt(x,y,color,n=110,power=1){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,s=(6+Math.random()*13)*power,coin=Math.random()<.45;
  conf.push({x:x/4,y:y/4,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:coin?7:10,h:coin?7:5,coin,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:Math.random()<.3?color:MONEYCOL[rnd(5)],life:130})}}

function sweep(color,n=24){for(let k=0;k<n;k++)setTimeout(()=>burstAt(k/n*12566+300,900,color,60,1.4),k*60)}

function moneyFx(k,delta){if(!delta)return;const el=$('team'+k);popText((delta>0?'+':'−')+money(Math.abs(delta)),el.offsetLeft+180,560,delta>0?'#34D399':'#F87171');if(delta>0)play('sfx_coins',{vol:.55});

(function fxLoop(){fc.clearRect(0,0,3142,270);
  for(let i=conf.length-1;i>=0;i--){const p=conf[i];p.vy+=.33;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    fc.save();fc.globalAlpha=Math.min(1,p.life/30);fc.translate(p.x<0?p.x+3142:p.x>3142?p.x-3142:p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;

/* ---------- floor: city at night from above ---------- */
const city=$('citycv'),cc=city.getContext('2d'),base=document.createElement('canvas');base.width=1424;base.height=1718;
const ROAD=172,RW=30,cars=[];
(function drawCity(){const b=base.getContext('2d');b.fillStyle='#070b16';b.fillRect(0,0,1424,1718);
  for(let y=0;y<1718;y+=ROAD)for(let x=0;x<1424;x+=ROAD){const bx=x+RW/2+6,by=y+RW/2+6,s=ROAD-RW-12;
    b.fillStyle=Math.random()<.12?'#0b1f17':'#0f1628';b.fillRect(bx,by,s,s);
    for(let k=0;k<3;k++){const w=30+Math.random()*60,h=30+Math.random()*60;b.fillStyle=`rgba(${30+rnd(20)},${40+rnd(20)},${70+rnd(30)},.9)`;b.fillRect(bx+Math.random()*(s-w),by+Math.random()*(s-h),w,h)}
    for(let k=0;k<14;k++){b.fillStyle='rgba(255,210,140,.45)';b.fillRect(bx+Math.random()*s,by+Math.random()*s,2,2)}}
  b.fillStyle='#141d33';for(let y=0;y<1718;y+=ROAD)b.fillRect(0,y-RW/2,1424,RW);for(let x=0;x<1424;x+=ROAD)b.fillRect(x-RW/2,0,RW,1718);
  b.strokeStyle='rgba(232,184,74,.35)';b.setLineDash([10,12]);b.lineWidth=2;
  for(let y=0;y<1718;y+=ROAD){b.beginPath();b.moveTo(0,y);b.lineTo(1424,y);b.stroke()}for(let x=0;x<1424;x+=ROAD){b.beginPath();b.moveTo(x,0);b.lineTo(x,1718);b.stroke()}
  for(let i=0;i<70;i++){const h=Math.random()<.5,lane=(rnd(h?10:9))*ROAD,dir=Math.random()<.5?1:-1;cars.push({h,lane:lane+dir*7,p:Math.random()*(h?1424:1718),v:(1.2+Math.random()*2.2)*dir})}})();
(function cityLoop(){cc.drawImage(base,0,0);
  for(const c of cars){c.p+=c.v;const L=c.h?1424:1718;if(c.p>L+20)c.p=-20;if(c.p<-20)c.p=L+20;
    const x=c.h?c.p:c.lane,y=c.h?c.lane:c.p,dx=c.h?Math.sign(c.v):0,dy=c.h?0:Math.sign(c.v);
    const gr=cc.createLinearGradient(x,y,x-dx*40,y-dy*40);gr.addColorStop(0,'rgba(255,240,200,.9)');gr.addColorStop(1,'rgba(255,60,60,0)');
    cc.strokeStyle=gr;cc.lineWidth=4;cc.beginPath();cc.moveTo(x,y);cc.lineTo(x-dx*40,y-dy*40);cc.stroke()}

/* ---------- game flow ---------- */
const act=(label,fn,cls='')=>({label,fn,cls});
function team(){return S.teams[S.cur]}
function setActs(a,b){S.actA=a||[];S.actB=b||[]}
function feed(t){S.feed.unshift(t);S.feed=S.feed.slice(0,12)}

function togglePick(id){const i=S.picked.indexOf(id);if(i>=0){if(S.picked.length>2)S.picked.splice(i,1)}else S.picked.push(id);play('sfx_hop');render()}

function startGame(fromIntro){ac();startMusic();
  S.teams=S.picked.map(id=>{const c=coById(id);return {mon:id,name:c.name,code:c.code,color:c.color,money:BANK.settings.start||1500,pos:0,jail:false,jailTurns:0,ok:0,att:0,prev:BANK.settings.start||1500,loans:[]}});
  S.cur=0;S.own={};S.pot=0;S.feed=[];S.log=[];S.used=new Set();S.lastQ={};S.lifeDeck=[];S.life=null;S.timeLeft=S.minutes*60;S.running=true;S.timeUp=false;S.finalRound=false;S.round=1;S.phase='play';
  feed(`Market open: ${S.teams.map(t=>t.name).join(', ')}.`);
  buildBoard();if(!fromIntro)host('welcome');sweep('#E8B84A',16);banner('MARKET OPEN');startTurn(!fromIntro,false,fromIntro)}

function startTurn(first,quiet,soon){
  S.q=null;S.kind=null;S.life=null;S.phase='play';const t=team();t.prev=cashNet(S.cur);floorMood('normal');
  if(t.jail){const n=t.jailTurns+1;
    S.msg=`${t.name} was SENT to the Revision Room, so no dice this turn. Answer one question correctly to get out (then roll). Attempt ${n} of ${JAIL_TRIES}${n===JAIL_TRIES?' – released after this one either way.':'.'}`;
    setActs([act('Answer to escape',()=>ask('jail',{}),'go')],[])}
  else{S.msg=`${t.name}, roll the dice.`;setActs(rollActs(),[]);if(!quiet)host('turn_'+t.mon,first?4800:soon?2600:0,first||soon?1:.6)}
  render()}
function rollActs(){return [act('Roll dice',()=>roll(),'go'),act('Physical dice',chooseTotal,'alt'),act('Loans',()=>loanMenu(()=>{S.msg=`${team().name}, roll the dice.`;setActs(rollActs(),[]);render()}),'')].concat(canBuild(S.cur)?[act('Build house',chooseBuild,'alt')]:[])}
function chooseTotal(){S.msg=`Roll your real dice, then tap the total.`;const a=[];for(let n=2;n<=12;n++)a.push(act(String(n),()=>roll(n),'num'));a.push(act('Back',()=>{setActs(rollActs(),[]);S.msg=`${team().name}, roll the dice.`;render()},'no'));setActs(a,[]);render()}

let cubeSpin=[0,0];
const SHOW={1:[0,0],2:[0,-90],3:[0,-180],4:[0,90],5:[-90,0],6:[90,0]};
function setDice(d,anim){d.forEach((v,k)=>{const c=$('cube'+k);if(!c)return;if(anim)cubeSpin[k]+=720;const [x,y]=SHOW[v];c.style.transform=`rotateX(${x+cubeSpin[k]}deg) rotateY(${y+cubeSpin[k]+(anim?360:0)}deg)`})}
function roll(total){
  if(S.busy)return;S.busy=true;setActs([],[]);
  let d;if(total){d=[Math.min(6,Math.max(total-6,Math.ceil(total/2))),0];d[1]=total-d[0]}
  else d=[1+rnd(6),1+rnd(6)];
  S.dice=d;S.msg=total?`${team().name} rolled ${total} on the real dice`:'Rolling…';render();play('sfx_dice');setDice(d,true);
  setTimeout(()=>{S.msg=`${team().name} rolled ${d[0]+d[1]}.`;renderTurn();setDice(d,false);move(d[0]+d[1])},total?600:1200)}

function move(steps){const t=team();S.hopper=S.cur;
  const step=()=>{t.pos=(t.pos+1)%40;play('sfx_hop',{vol:.5,max:.4});
    if(t.pos===0){const g=BANK.settings.go||200;t.money+=g;feed(`${t.name} passed GO: +${money(g)}`);burstSquare(0,t.color);moneyFx(S.cur,g);
      const added=chargeInterest(S.cur);if(added)host('interest',300);else host('go',0,.5)}
    renderBoardDyn();renderTeams();
    if(--steps>0)setTimeout(step,300);else{S.hopper=-1;S.busy=false;land()}};
  step()}

function land(){const t=team(),i=t.pos,b=BOARD[i];S.landed=i;
  if(['prop','hub','util'].includes(b.t)){const o=S.own[i];
    if(!o){const p=price(i);S.msg=`${label(i)} is for sale at ${money(p)}. Answer correctly to buy it.`;
      setActs([t.money>=p?act(`Buy (${money(p)})`,()=>ask('buy',{i}),'go'):act(`Can't afford ${money(p)}`,()=>{},'off')].concat(t.money<p?[act('Get a loan',()=>loanMenu(land),'alt')]:[]).concat([act('Pass',endTurn,'no')]),[])}
    else if(o.team===S.cur){S.msg=`${t.name} owns ${label(i)}. Safe.`;endActs()}
    else{const r=rent(i),ow=S.teams[o.team];S.msg=`${label(i)} belongs to ${ow.name}. Rent is ${money(r)}. Pay, or challenge: right = pay nothing, wrong = pay double.`;
      play('sfx_ooh',{vol:.5});host('rent',300,.7);
      setActs([act(`Pay rent (${money(r)})`,()=>{pay(S.cur,r,o.team);feed(`${t.name} paid ${money(r)} rent to ${ow.name}`);S.msg=`Paid ${money(r)} to ${ow.name}.`;endActs();render()},'alt'),act('Challenge',()=>ask('challenge',{i,r,to:o.team}),'go')],[])}}
  else if(b.t==='pop'||b.t==='real'||b.t==='bonus'){ask(b.t,{i});return}
  else if(b.t==='life'){lifeCard();return}
  else if(b.t==='tax'){pay(S.cur,b.amt,'pot');S.msg=`Late submission fee. ${money(b.amt)} goes into the Jackpot.`;feed(`${t.name} paid a ${money(b.amt)} late fee`);host('late',0,.8);endActs()}
  else if(b.t==='gojail'){toJail(S.cur);S.msg=`${t.name} goes straight to the Revision Room. Next turn: answer one question correctly to get out.`;feed(`${t.name} sent to the Revision Room`);endActs()}
  else{S.msg=b.t==='go'?`${t.name} landed on GO.`:`${t.name} is just visiting the Revision Room. No question needed – only teams sent here by "Go to the Revision Room" have to answer to get out.`;endActs()}
  render()}

function lifeCard(){const t=team();if(!S.lifeDeck.length)S.lifeDeck=LIFE.map((_,n)=>n).sort(()=>Math.random()-.5);
  const e=LIFE[S.lifeDeck.pop()],amt=e.f(t);S.q=null;S.life={...e,amt};banner('LIFE HAPPENS');play('sfx_card',{vol:.6});
  if(e.bad){S.msg=`Life happens: ${e.t}. ${t.name} pays ${money(amt)} into the Jackpot.`;host(e.tax?'taxman':'eventbad',200);setTimeout(()=>play('sfx_sad',{vol:.4,max:2.2}),400);floorMood('sad','−'+money(amt));pay(S.cur,amt,'pot')}
  else{t.money+=amt;moneyFx(S.cur,amt);S.msg=`Life happens: ${e.t}. ${t.name} gets ${money(amt)}.`;host('eventgood',200);setTimeout(()=>play('sfx_happy',{vol:.4,max:2.2}),400);floorMood('happy','+'+money(amt))}
  feed(`${t.name}: ${e.t} (${e.bad?'−':'+'}${money(amt)})`);endActs();render()}
function endActs(){setActs([act('End turn',endTurn),act('Loans',()=>loanMenu(endActs),'')].concat(canBuild(S.cur)?[act('Build house',chooseBuild,'alt')]:[]),[])}

/* ---------- loans ---------- */
function debt(k){return (S.teams[k].loans||[]).reduce((a,l)=>a+l.owed,0)}
function loanMenu(back){const t=team();S.loanBack=()=>{back();render()};
  S.msg=`${t.name}: Bank loan = 10% interest per lap, but you must answer a money question to be approved. Payday loan = instant, 40% per lap. Interest is added each time you pass GO.`;
  const a=[];if(t.loans.filter(l=>!l.auto).length<2)a.push(act('Bank £250',()=>ask('bank',{amt:250}),'go'),act('Bank £500',()=>ask('bank',{amt:500}),'go'),act('Payday £250',()=>takePayday(250),'no'),act('Payday £500',()=>takePayday(500),'no'));
  t.loans.forEach((l,n)=>{a.push(t.money>=l.owed?act(`Repay ${l.auto?'auto ':''}${l.type} ${money(l.owed)}`,()=>repay(n),'alt'):act(`Owe ${money(l.owed)} (${l.type})`,()=>{},'off'))});
  a.push(act('Back',S.loanBack,''));setActs(a,[]);render()}
function takePayday(amt){const t=team();t.loans.push({type:'payday',principal:amt,owed:amt});t.money+=amt;moneyFx(S.cur,amt);
  feed(`${t.name} took a ${money(amt)} payday loan at 40% per lap.`);host('payday');popText('PAYDAY LOAN',$('team'+S.cur).offsetLeft+60,700,'#F87171');S.loanBack()}
function repay(n){const t=team(),l=t.loans[n];t.money-=l.owed;moneyFx(S.cur,-l.owed);t.loans.splice(n,1);feed(`${t.name} repaid a ${l.type} loan (${money(l.owed)}).`);host('repay');S.loanBack()}
function chargeInterest(k){const t=S.teams[k];let added=0;
  (t.loans||[]).forEach(l=>{let i=Math.round(l.principal*LOAN[l.type].rate);if(l.type==='payday')i=Math.min(i,l.principal*2-l.owed);if(i>0){l.owed+=i;added+=i}});
  if(added){feed(`${t.name}: ${money(added)} loan interest added.`);popText('+'+money(added)+' DEBT',$('team'+k).offsetLeft+60,760,'#F87171')}return added}

function pay(f,amt,to){const t=S.teams[f],short=amt-t.money;
  if(short>0){const need=Math.ceil(short/50)*50;let l=t.loans.find(x=>x.auto);
    if(l){l.principal+=need;l.owed+=need}else t.loans.push({type:'payday',principal:need,owed:need,auto:true});t.money+=need;
    feed(`${t.name} couldn't cover ${money(amt)}. Automatic payday loan: ${money(need)} at 40% per lap.`);host('autoloan',2600);
    const el=$('team'+f);if(el)popText('AUTO PAYDAY LOAN',el.offsetLeft+40,820,'#F87171')}
  t.money-=amt;moneyFx(f,-amt);
  if(to==='pot')S.pot+=amt;else if(typeof to==='number'){S.teams[to].money+=amt;setTimeout(()=>moneyFx(to,amt),400)}}
function toJail(f){const t=S.teams[f];t.jail=true;t.jailTurns=0;t.pos=10;renderBoardDyn();play('sfx_jail',{vol:.6});host('revision',600);if(f===S.cur){floorMood('sad','LOCKED IN');banner('REVISION ROOM')}}

function canBuild(k){const t=S.teams[k];if(!t||t.jail)return false;return buildable(k).length>0}
function buildable(k){const t=S.teams[k],out=[];
  for(let u=1;u<=8;u++){if(!ownsSet(k,u)||t.money<HOUSE[u])continue;unitSquares(u).forEach(i=>{if(S.own[i].houses<5)out.push(i)})}
  return out}
function chooseBuild(){const prev=S.actA;S.msg=`${team().name}: pick a property to build on. Each house means a harder question.`;
  setActs(buildable(S.cur).map(i=>act(`${label(i)} (${S.own[i].houses===4?'hotel':'house '+(S.own[i].houses+1)})`,()=>ask('house',{i}),'go')).concat([act('Cancel',()=>{setActs(prev,[]);render()},'no')]),[]);render()}

function ask(kind,ctx){S.kind=kind;S.ctx=ctx;let q=null;
  const avoid=ctx.i!=null?S.lastQ[ctx.i]:null;
  if(kind==='buy'||kind==='challenge')q=pickQ(chainFor(ctx.i,1),avoid);
  else if(kind==='house'){const h=S.own[ctx.i].houses;q=h>=4?teachBack(ctx.i):pickQ(chainFor(ctx.i,h<2?2:3),avoid)}
  else if(kind==='bank')q=pickQ([['U6',null],['6A',null],['6B',null],['6C',null],['ANY',null]]);
  else q=pickQ([[KIND_TOPIC[kind],null],['ANY',null]]);
  if(q&&ctx.i!=null)S.lastQ[ctx.i]=q.id;
  S.qLeft=ANSWER_SECS;S.timedOut=false;
  S.q=q||{id:'none',q:'No question found for this topic. Tutor: ask one out loud.',opts:[],ans:'',exp:''};
  S.revealed=false;S.chosen=null;S.phase='question';
  const jt=team()?team().jailTurns+1:1;
  const L=ctx.i!=null?label(ctx.i):'';const titles={buy:`Buy ${L}?`,challenge:`Rent challenge: ${L}`,house:`Build on ${L}`,pop:'Pop quiz · correct = +£100',real:'Real world · correct = +£150, wrong = −£75',jail:`Revision Room · correct = you're out · attempt ${jt} of ${JAIL_TRIES}`,bonus:`Bonus round · everyone answers · Jackpot ${money(S.pot+100)}`,bank:`Bank loan application · ${money(ctx.amt||0)} · answer correctly to be approved`};
  S.qtitle=titles[kind];
  let b=[];
  if(kind==='bonus'){b=S.teams.map((tm,k)=>act(`${tm.name} wins`,()=>awardBonus(k),'go')).concat([act('No winner',()=>awardBonus(-1),'no')])}
  else{b=[act('✓ Correct',()=>judge(true),'go'),act('✗ Wrong',()=>judge(false),'no')];if(['buy','challenge','house'].includes(kind))b.push(act('Chicken out',chicken,'alt'))}
  if(!S.q.opts.length&&S.q.ans)b.unshift(act('Show answer',()=>{S.revealed=true;renderQ()},'alt'));
  S.msg=kind==='bonus'?'Every team can answer. Tutor picks who got it right first.':kind==='bank'?`${team().name}: the bank wants to know you understand money. Get this right and the loan is approved.`:kind==='jail'?`${team().name}: get this right to leave the Revision Room.`:`${team().name}: answer the question on the front wall.`;
  play('sfx_card',{vol:.6});thinking(true);
  if(kind==='pop')host('pop',0,.6);if(kind==='real')host('real',0,.6);if(kind==='bonus'){host('bonus');banner('BONUS ROUND')}
  setActs([],b);render();const qc=$('qcard');qc.classList.remove('flip');void qc.offsetWidth;qc.classList.add('flip')}

function chooseOpt(L){if(S.phase!=='question')return;S.chosen=L;
  if(S.kind==='bonus'){S.revealed=true;renderQ();return}
  judge(L===S.q.ans)}

function logAns(teamIdx,ok){const k=S.kind,c=S.ctx;const cat=['buy','challenge','house'].includes(k)?catOf(c.i):{pop:'POP',real:'REAL',bonus:'BONUS',jail:'REV',bank:'U6'}[k];
  const t=S.teams[teamIdx];t.att++;if(ok)t.ok++;
  S.log.push({time:new Date().toLocaleTimeString('en-GB'),team:t.name,category:catName(cat)||'Revision',topic:c&&c.i!=null?longLabel(c.i):'',type:k,question:S.q.q,correct:ok?'Yes':'No',cat})}

function judge(ok){if(S.phase!=='question')return;const t=team(),k=S.kind,c=S.ctx,to=S.timedOut;S.timedOut=false;S.revealed=true;S.phase='result';logAns(S.cur,ok);let res='';
  thinking(false);cheer(ok);floorMood(ok?'happy':'sad',ok?'▲ CORRECT':'▼ WRONG');
  if(k==='buy'){const p=price(c.i);if(ok){pay(S.cur,p,'bank');S.own[c.i]={team:S.cur,houses:0,qid:S.q.id};res=`Correct. ${t.name} buys ${label(c.i)} for ${money(p)}.`;burstSquare(c.i,t.color);host('buy',700,.75)}
    else{const pen=Math.round(p/2);pay(S.cur,pen,'pot');res=`Wrong. ${t.name} pays a ${money(pen)} penalty into the Jackpot.`;if(!to)host('wrong',700,.75)}}
  else if(k==='house'){const hc=HOUSE[BOARD[c.i].u];if(ok){pay(S.cur,hc,'bank');S.own[c.i].houses++;const hotel=S.own[c.i].houses===5;res=`Correct. ${hotel?'Hotel':'House'} built on ${label(c.i)} for ${money(hc)}.`;burstSquare(c.i,t.color);play('sfx_build');host(hotel?'hotel':'house',800,hotel?1:.8);if(hotel){banner('HOTEL');sweep(t.color,12)}}
    else{const pen=Math.round(hc/2);pay(S.cur,pen,'pot');res=`Wrong. ${money(pen)} penalty into the Jackpot.`;if(!to)host('wrong',700,.75)}}
  else if(k==='challenge'){if(ok){res=`Challenge won. ${t.name} pays no rent.`;burstSquare(c.i,t.color);host('cwon',700)}else{pay(S.cur,c.r*2,c.to);res=`Challenge lost. ${t.name} pays double rent: ${money(c.r*2)} to ${S.teams[c.to].name}.`;if(!to)host('clost',700)}}
  else if(k==='pop'){if(ok){t.money+=100;moneyFx(S.cur,100);res=`Correct. ${t.name} wins ${money(100)}.`;burstSquare(t.pos,t.color)}else res='Not this time. No reward.'}
  else if(k==='real'){if(ok){t.money+=150;moneyFx(S.cur,150);res=`Good call. ${t.name} earns ${money(150)}.`;burstSquare(t.pos,t.color)}else{pay(S.cur,75,'pot');res=`Not the best choice. ${money(75)} into the Jackpot.`}}
  else if(k==='bank'){if(ok){t.loans.push({type:'bank',principal:c.amt,owed:c.amt});t.money+=c.amt;moneyFx(S.cur,c.amt);res=`Approved. ${t.name} borrows ${money(c.amt)} from the bank at 10% per lap.`;host('bankok',700)}
    else{res=`The bank says no. No cost – you can try a payday loan or carry on.`;if(!to)host('bankno',700)}}
  else if(k==='jail'){t.jailTurns++;
    if(ok){t.jail=false;let extra='';if(t.money<100){t.money+=100;moneyFx(S.cur,100);extra=` Study grant: +${money(100)}.`}res=`Correct. ${t.name} is out of the Revision Room – roll the dice.${extra}`;host('escape',700);banner('RELEASED')}
    else if(t.jailTurns>=JAIL_TRIES){t.jail=false;res=`Wrong, but that was attempt ${JAIL_TRIES} of ${JAIL_TRIES}. ${t.name} is released and moves next turn.`}
    else res=`Wrong. ${t.name} stays in the Revision Room. ${JAIL_TRIES-t.jailTurns} attempt${JAIL_TRIES-t.jailTurns>1?'s':''} left (one per turn).`}
  if(to){res='Out of time. '+res;host('timeout',600)}
  feed(res);S.msg=res;
  if(k==='bank'){S.loanBack();return}
  if(k==='jail'&&ok)setActs(rollActs(),[]);else endActs();
  render()}

function chicken(){if(S.phase!=='question')return;const t=team(),k=S.kind,c=S.ctx;S.revealed=true;S.phase='result';let res;thinking(false);host('chicken',0,.9);floorMood('sad','CHICKENED OUT');
  if(k==='buy'){const pen=Math.round(price(c.i)/4);pay(S.cur,pen,'pot');res=`${t.name} chickened out. ${money(pen)} into the Jackpot.`}
  else if(k==='house'){const pen=Math.round(HOUSE[BOARD[c.i].u]/4);pay(S.cur,pen,'pot');res=`${t.name} chickened out. ${money(pen)} into the Jackpot.`}
  else{pay(S.cur,c.r,c.to);res=`${t.name} backed down and paid the normal rent: ${money(c.r)}.`}
  feed(res);S.msg=res;endActs();render()}

function awardBonus(k){if(S.phase!=='question')return;S.revealed=true;S.phase='result';let res;thinking(false);
  if(k>=0){const prize=S.pot+100,w=S.teams[k];w.money+=prize;moneyFx(k,prize);logAns(k,true);res=`${w.name} wins the Jackpot: ${money(prize)}.`;S.pot=0;cheer(true);sweep(w.color,14);banner('JACKPOT');host('jackpot',500)}
  else{res='No winner. The Jackpot keeps growing.';cheer(false)}
  feed(res);S.msg=res;endActs();render()}

function endTurn(){if(S.busy)return;const next=(S.cur+1)%S.teams.length;let quiet=false;
  if(next===0){if(S.finalRound){endGame();return}S.round++;
    if(S.timeUp){S.finalRound=true;quiet=true;feed('Final round: every company gets one last turn.');banner('FINAL ROUND');host('finalround')}}
  S.cur=next;startTurn(false,quiet)}

function cashNet(k){return S.teams[k].money-debt(k)}
function worth(k){let w=S.teams[k].money-debt(k);for(const i in S.own){const o=S.own[i];if(o.team===k){w+=price(i);if(o.houses)w+=o.houses*HOUSE[BOARD[i].u]}}return w}
function accBonus(k){const t=S.teams[k];return t.att?Math.round(t.ok/t.att*500):0}
function endGame(){S.phase='end';S.running=false;thinking(false);
  S.final=S.teams.map((t,k)=>({k,name:t.name,mon:t.mon,cash:t.money,debt:debt(k),props:Object.values(S.own).filter(o=>o.team===k).length,acc:t.att?Math.round(t.ok/t.att*100):0})).map(r=>({...r,total:r.cash-r.debt})).sort((a,b)=>b.total-a.total);
  const w=S.final[0];S.cur=w.k;S.msg=`Market closed. ${w.name} wins.`;feed(S.msg);
  play('sfx_fanfare');host('win_'+w.mon,1200);banner(`${w.name.toUpperCase()} WINS`);sweep(S.teams[w.k].color,30);setTimeout(()=>sweep('#E8B84A',30),1500);floorMood('happy','WINNER');
  setActs([act('New game',()=>{S.phase='setup';S.own={};S.landed=null;S.q=null;buildBoard();render()},'alt')],[]);render()}

/* ---------- timer ---------- */
setInterval(()=>{if(!S.running||S.phase==='setup'||S.phase==='end'||S.phase==='intro')return;
  if(S.phase==='question'&&S.qLeft>0){S.qLeft--;renderQClock();if(S.qLeft<=10&&S.qLeft>0)play('sfx_tick',{vol:.55});if(S.qLeft===0)qTimeout()}
  if(S.timeLeft>0){S.timeLeft--;if(S.timeLeft===0){S.timeUp=true;feed("Time's up. This round finishes, then one final round so every company has the same number of turns.");host('timeup');banner("TIME'S UP")}renderTimer()}},1000);
function qTimeout(){play('sfx_timeup',{vol:.7});
  if(S.q&&String(S.q.id).startsWith('teach')){S.msg='Time. Tutor: was the explanation clear and accurate?';renderTurn();return}
  if(S.kind==='bonus'){awardBonus(-1);return}
  S.timedOut=true;judge(false)}
function renderQClock(){const c=$('qclock');if(!c)return;c.textContent=S.qLeft+'s';c.classList.toggle('low',S.qLeft<=10)}

function exportCSV(){const cols=['time','team','category','topic','type','question','correct'];
  const csv=[cols.join(',')].concat(S.log.map(r=>cols.map(c=>`"${String(r[c]).replace(/"/g,'""')}"`).join(','))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`tycoon-results-${new Date().toISOString().slice(0,10)}.csv`;a.click()}

/* ---------- rendering ---------- */
function buildBoard(){let h='';
  BOARD.forEach((b,i)=>{const g=sqGeom(i);let cls='sq',inner='';
    if(b.t==='prop')inner=`<div class="strip" style="background:${UNITCOL[b.u]};color:${UNITTXT[b.u]}">UNIT ${b.u} · ${esc(nm('U'+b.u)).toUpperCase()}</div><div class="nm">${esc(nm(b.c))}</div><div class="pr">${money(price(i))} <span class="rn">· rent ${money(PR[b.c][1])}</span></div>`;

/* ---------- Excel loading (built-in reader, no internet needed) ---------- */
async function unzip(buf){const d=new DataView(buf),u8=new Uint8Array(buf),files={};let e=buf.byteLength-22;
  while(e>=0&&d.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Not an Excel file');
  let p=d.getUint32(e+16,true);const n=d.getUint16(e+10,true);const td=new TextDecoder();
  for(let k=0;k<n;k++){const method=d.getUint16(p+10,true),cs=d.getUint32(p+20,true),nl=d.getUint16(p+28,true),xl=d.getUint16(p+30,true),cl=d.getUint16(p+32,true),off=d.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    const ds=off+30+d.getUint16(off+26,true)+d.getUint16(off+28,true),raw=u8.slice(ds,ds+cs);
    files[name]={method,raw}}
  return async name=>{const f=files[name];if(!f)return null;
    if(f.method===0)return new TextDecoder().decode(f.raw);
    const s=new Blob([f.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(s).text()}}
async function readXlsx(buf){const get=await unzip(buf),X=t=>new DOMParser().parseFromString(t,'application/xml');
  const wb=X(await get('xl/workbook.xml')),rels=X(await get('xl/_rels/workbook.xml.rels'));
  const relMap={};[...rels.getElementsByTagName('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const ssx=await get('xl/sharedStrings.xml');const ss=ssx?[...X(ssx).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const col=r=>{let c=0;for(const ch of r.replace(/\d+/g,''))c=c*26+ch.charCodeAt(0)-64;return c-1};
  const out={};
  for(const sh of wb.getElementsByTagName('sheet')){let t=relMap[sh.getAttribute('r:id')]||'';t=t.startsWith('/')?t.slice(1):'xl/'+t;
    const x=await get(t);if(!x)continue;const grid=[];
    for(const row of X(x).getElementsByTagName('row')){const r=[];
      for(const c of row.getElementsByTagName('c')){const ty=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val='';
        if(ty==='s'&&v)val=ss[+v.textContent]||'';else if(ty==='inlineStr')val=[...c.getElementsByTagName('t')].map(z=>z.textContent).join('');else if(v)val=v.textContent;
        r[col(c.getAttribute('r'))]=val}
      grid[(+row.getAttribute('r')||grid.length+1)-1]=r}
    const head=(grid[0]||[]).map(h=>String(h||'').trim());
    out[sh.getAttribute('name').trim().toLowerCase()]=grid.slice(1).filter(Boolean).map(r=>{const o={};head.forEach((h,i)=>{if(h)o[h]=r[i]==null?'':r[i]});return o})}
  return out}
function parseWorkbook(sheets){
  const get=n=>sheets[n]||[];
  const out=JSON.parse(JSON.stringify(SAMPLE));
  get('settings').forEach(r=>{const k=String(r.Setting||'').trim().toLowerCase(),v=r.Value;
    if(k==='game name'&&String(v).trim())out.settings.name=String(v).trim();if(k==='starting money')out.settings.start=+v||1500;if(k==='go money')out.settings.go=+v||200;if(k==='minutes')out.settings.minutes=+v||60});
  get('names').forEach(r=>{const c=String(r.Code||'').trim().toUpperCase(),v=String(r.Name||'').trim();if(c&&v)out.names[c]=v});
  const qs=get('questions').filter(r=>String(r.Question||'').trim()).map((r,n)=>{
    const opts=['A','B','C','D'].map(L=>({L,text:String(r['Option '+L]||'').trim()})).filter(o=>o.text);
    let ans=String(r.Answer||'').trim();if(opts.length&&/^[a-d]$/i.test(ans))ans=ans.toUpperCase();
    return {id:'x'+n,topic:String(r.Topic||'ANY').trim().toUpperCase()||'ANY',level:parseInt(r.Level)||1,q:String(r.Question).trim(),opts,ans,exp:String(r.Explanation||'').trim()}});
  if(qs.length)out.questions=qs;
  return out}
async function useWorkbook(buf,src){try{BANK=parseWorkbook(await readXlsx(buf));BANKSRC=src;S.minutes=BANK.settings.minutes||S.minutes;buildBoard();render()}
  catch(e){console.warn(e);BANKSRC='Could not read that file (is it .xlsx?). Still using the previous questions.';render()}}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>useWorkbook(r.result,'Loaded: '+f.name);r.readAsArrayBuffer(f);e.target.value=''};
(function autoLoad(){if(!/^https?:/.test(location.protocol))return;
  const url=new URLSearchParams(location.search).get('q')||'questions.xlsx';
  fetch(url,{cache:'no-store'}).then(r=>r.ok?r.arrayBuffer():null).then(b=>{if(b&&S.phase==='setup')useWorkbook(b,'Loaded from '+url.split('/').pop())}).catch(()=>{})})();

/* Scale by WIDTH only. The Igloo webview reports a shorter height (e.g. 12566 x 3978) than it actually
   projects (4516), so the reported height can't be trusted. ?preview fits the whole canvas in a laptop window.
   CAL = fine calibration (height scale + vertical offset), set from the grid panel and remembered on this PC. */
let CAL={sy:1,oy:0};
try{Object.assign(CAL,JSON.parse(localStorage.getItem('cal2')||'{}'))}catch(e){}
(()=>{const q=new URLSearchParams(location.search);if(q.has('sy'))CAL.sy=+q.get('sy');if(q.has('oy'))CAL.oy=+q.get('oy')})();
function scaleStage(){const q=new URLSearchParams(location.search);let sx=innerWidth/12566,sy=sx;
  if(q.has('native'))sx=sy=1;else if(q.has('preview'))sx=sy=Math.min(innerWidth/12566,innerHeight/4516);
  $('stage').style.transform=`translate(0px,${CAL.oy*sy}px) scale(${sx},${sy*CAL.sy})`;showCal()}
function setCal(dsy,doy,reset){if(reset)CAL={sy:1,oy:0};else{CAL.sy=Math.round((CAL.sy+dsy)*1000)/1000;CAL.oy+=doy}
  try{localStorage.setItem('cal2',JSON.stringify(CAL))}catch(e){}scaleStage()}
function showCal(){const r=$('calread');if(r)r.innerHTML=`Webview size: <b>${innerWidth} × ${innerHeight}</b> px · pixel ratio ${devicePixelRatio}<br>Height scale: <b>${CAL.sy.toFixed(3)}</b> · Vertical shift: <b>${CAL.oy}</b> px`}

function toggleGrid(){let g=$('calib');if(g){g.remove();$('calpanel').remove();return}g=document.createElement('div');g.id='calib';

    background:repeating-linear-gradient(0deg,transparent 0 98px,rgba(255,255,255,.5) 98px 100px),repeating-linear-gradient(90deg,transparent 0 98px,rgba(255,255,255,.5) 98px 100px)">
    <div style="position:absolute;left:30px;top:30px;font-size:44px;line-height:1.3;background:rgba(0,0,0,.7);padding:10px 18px;color:#fff">Projector ${n}<br>X: ${(x/12566).toFixed(3)} – ${x} px<br>Y: ${(y/4516).toFixed(3)} – ${y} px<br>W: ${w} px · H: ${h} px</div>
    <div style="position:absolute;left:50%;top:50%;width:${Math.min(w,h)*.5}px;height:${Math.min(w,h)*.5}px;transform:translate(-50%,-50%);border:6px solid #fff;border-radius:50%"></div></div>`).join('')+
    `<div style="position:absolute;left:0;top:1074px;width:12566px;height:12px;background:#ff2e88"></div>`;
  $('stage').appendChild(g);
  const c=document.createElement('div');c.id='calpanel';
  c.style.cssText='position:absolute;left:3536px;top:1300px;width:2647px;z-index:1000;background:rgba(10,14,40,.92);border:8px solid #ff2e88;border-radius:40px;padding:40px;box-sizing:border-box;color:#fff;font-size:60px;line-height:1.3';
  const B=(t,f)=>`<button class="btn" style="font-size:64px;height:170px;margin:12px" onclick="${f}">${t}</button>`;
  c.innerHTML=`<div style="font-size:80px;font-weight:600;color:#ffd23f">Alignment</div>
   <div>The pink line should sit exactly where the walls meet the floor.</div><div id="calread" style="margin:24px 0;color:#cfd8ff"></div>
   <div>Wall height</div>${B('Taller ++','setCal(.02,0)')}${B('Taller +','setCal(.005,0)')}${B('Shorter −','setCal(-.005,0)')}${B('Shorter −−','setCal(-.02,0)')}
   <div style="margin-top:20px">Move everything</div>${B('Down ++','setCal(0,40)')}${B('Down +','setCal(0,10)')}${B('Up −','setCal(0,-10)')}${B('Up −−','setCal(0,-40)')}
   <div style="margin-top:20px">${B('Reset','setCal(0,0,true)')}${B('Close grid','toggleGrid()')}</div>
   <div style="font-size:44px;color:#cfd8ff;margin-top:16px">Settings are remembered on this PC. Send Claude the numbers above so they can be built in.</div>`;
  $('stage').appendChild(c);showCal()}

  const f=e.shiftKey?.001:.01;if(e.key==='ArrowUp')setCal(f,0);if(e.key==='ArrowDown')setCal(-f,0);if(e.key==='PageDown')setCal(0,10);if(e.key==='PageUp')setCal(0,-10)});
