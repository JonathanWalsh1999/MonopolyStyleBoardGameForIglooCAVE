<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Fredoka','Arial Rounded MT Bold',Arial,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:12566px;height:4516px;transform-origin:0 0}
.wall{position:absolute;top:0;height:1080px;background:#16213e}
#floor{position:absolute;left:3436px;top:1080px;width:2847px;height:3436px}
.sq{position:absolute;top:0;height:380px;box-sizing:border-box;border-right:4px solid #0b1020;border-bottom:6px solid #0b1020;background:#fdf6e3;color:#1b1b2f;overflow:hidden}
.sq .strip{height:72px;font-size:30px;font-weight:600;padding:16px 14px 0;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq .nm{padding:10px 14px 0;font-weight:600;line-height:1.08;height:128px;overflow:hidden;font-size:38px}
.sq .pr{padding:2px 14px 0;font-size:30px}
.sq .tok{position:absolute;left:10px;right:10px;top:236px;height:66px;display:flex;gap:4px}
.tk{flex:0 0 40px;height:60px;border-radius:50% 50% 10px 10px;border:4px solid #1b1b2f;font-size:30px;font-weight:600;display:flex;align-items:center;justify-content:center;color:#1b1b2f;box-sizing:border-box}
.sq .own{position:absolute;left:0;right:0;bottom:0;height:66px;font-size:28px;font-weight:600;padding:14px 14px;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq.corner{background:#ffd23f}
.sq.special{background:#dff1ff}
.sq.cur{box-shadow:inset 0 0 0 12px #ff2e88}
.sq .big{padding:24px 14px 0;font-size:44px;font-weight:600;line-height:1.05}
.sq .sub{padding:8px 14px 0;font-size:28px;line-height:1.15}
.panel{position:absolute;top:420px;background:#22305a;border-radius:36px;box-sizing:border-box;padding:28px 36px;overflow:hidden}
.panel h2{margin:0 0 10px;font-size:46px;font-weight:600;color:#ffd23f}
.team{width:800px;height:620px}
.team .tname{font-size:56px;font-weight:600;display:flex;align-items:center;gap:20px;white-space:nowrap;overflow:hidden}
.team .money{font-size:110px;font-weight:600;margin:6px 0}
.team .stat{font-size:34px;color:#cfd8ff}
.team .chips{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:28px;font-weight:600;padding:6px 14px;border-radius:14px;color:#1b1b2f}
.team.active{box-shadow:0 0 0 12px #ff2e88}
.team.empty{opacity:.25}
.badge{display:inline-flex;width:70px;height:70px;border-radius:50%;align-items:center;justify-content:center;color:#1b1b2f;font-size:44px;font-weight:600;border:5px solid #fff;flex:0 0 70px}
.dock{position:absolute;top:880px;height:180px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px}
.btn{font-family:inherit;font-size:50px;font-weight:600;border:none;border-radius:28px;padding:0 38px;height:150px;cursor:pointer;background:#ffd23f;color:#1b1b2f}
.dock.many .btn{font-size:34px;height:82px;padding:0 24px;border-radius:20px}
.btn.go{background:#3ddc97}.btn.no{background:#ff7b7f}.btn.alt{background:#7fd8ff}.btn.off{background:#596384;color:#c6cbe0;cursor:default}
.btn.sm{font-size:32px;height:76px;padding:0 24px;border-radius:18px}
#timer .btn.sm{font-size:28px;height:62px}
.btn.sel{outline:8px solid #fff}
#turn .who{font-size:64px;font-weight:600;display:flex;align-items:center;gap:24px}
#dice{display:flex;gap:30px;margin:22px 0}
.die{width:150px;height:150px;border-radius:30px;background:#fff;color:#1b1b2f;font-size:100px;font-weight:600;display:flex;align-items:center;justify-content:center}
#msg{font-size:40px;line-height:1.2;color:#e7ecff}
#qcard{background:#fdf6e3;color:#1b1b2f}
#qcard .qh{font-size:34px;font-weight:600;color:#6b4e00;margin-bottom:8px}
#qcard .qq{font-weight:600;line-height:1.15;margin-bottom:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{background:#fff;border:5px solid #1b1b2f;border-radius:22px;padding:12px 18px;font-size:36px;cursor:pointer;line-height:1.15;display:flex;gap:14px;align-items:center}
.opt b{flex:0 0 auto}
.opt.right{background:#c8f7dc;border-color:#0b7a43}
.opt.wrong{background:#ffd6d6;border-color:#a3171b}
.exp{margin-top:14px;font-size:32px;line-height:1.2;color:#333}
.feed div{font-size:32px;line-height:1.2;padding:8px 0;border-bottom:2px solid #33427a}
.lb-row{display:flex;align-items:center;gap:20px;font-size:44px;padding:10px 0;border-bottom:2px solid #33427a}
.lb-row .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .v{font-weight:600}
.lb-row .s{font-size:30px;color:#cfd8ff;width:300px;text-align:right}
#timer .t{font-size:110px;font-weight:600;line-height:1}
.heat{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
.hrow{display:flex;align-items:center;gap:10px;font-size:26px;margin:3px 0}
.hrow span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar{flex:0 0 130px;height:14px;background:#33427a;border-radius:7px;overflow:hidden}
.hbar i{display:block;height:100%;background:#7fd8ff}
.hide{display:none!important}
.setrow{font-size:40px;margin:18px 0 12px}
#floorcv{position:absolute;left:0;top:0}
</style>

</div>
<input type="file" id="file" accept=".xlsx,.xls" class="hide">
<script>
const SAMPLE = /*__SAMPLE_DATA__*/null;

const WALLS=[{x:0,w:3436},{x:3436,w:2847},{x:6283,w:3436},{x:9719,w:2847}];
const UNITCOL=['','#C0703A','#4FC3F7','#F48FB1','#FFA726','#EF5350','#FFEE58','#66BB6A','#5C6BC0'];
const UNITTXT=['','#fff','#0b2533','#3a0d1f','#2b1600','#fff','#2b2600','#0d230e','#fff'];
const TEAMCOL=['#FF6B6B','#4FC3F7','#FFD740','#69F0AE','#E585FF','#FFA94D'];
const BOARD=[
 {t:'go'},{t:'prop',u:1,c:'1A'},{t:'real'},{t:'prop',u:1,c:'1B'},{t:'tax',amt:100},{t:'hub',c:'HUB1'},{t:'prop',u:2,c:'2A'},{t:'pop'},{t:'prop',u:2,c:'2B'},{t:'prop',u:2,c:'2C'},
 {t:'jail'},{t:'prop',u:3,c:'3A'},{t:'util',c:'MATHS'},{t:'prop',u:3,c:'3B'},{t:'prop',u:3,c:'3C'},{t:'hub',c:'HUB2'},{t:'prop',u:4,c:'4A'},{t:'real'},{t:'prop',u:4,c:'4B'},{t:'prop',u:4,c:'4C'},
 {t:'bonus'},{t:'prop',u:5,c:'5A'},{t:'pop'},{t:'prop',u:5,c:'5B'},{t:'prop',u:5,c:'5C'},{t:'hub',c:'HUB3'},{t:'prop',u:6,c:'6A'},{t:'prop',u:6,c:'6B'},{t:'util',c:'ENGLISH'},{t:'prop',u:6,c:'6C'},
 {t:'gojail'},{t:'prop',u:7,c:'7A'},{t:'prop',u:7,c:'7B'},{t:'real'},{t:'prop',u:7,c:'7C'},{t:'hub',c:'HUB4'},{t:'pop'},{t:'prop',u:8,c:'8A'},{t:'tax',amt:200},{t:'prop',u:8,c:'8B'}];
const R={a:[2,10,30,90,160,250],b:[4,20,60,180,320,450],c:[6,30,90,270,400,550],d:[8,40,100,300,450,600],e:[10,50,150,450,625,750],f:[12,60,180,500,700,900],g:[14,70,200,550,750,950],h:[16,80,220,600,800,1000],i:[18,90,250,700,875,1050],j:[20,100,300,750,925,1100],k:[22,110,330,800,975,1150],l:[24,120,360,850,1025,1200],m:[26,130,390,900,1100,1275],n:[28,150,450,1000,1200,1400],o:[35,175,500,1100,1300,1500],p:[50,200,600,1400,1700,2000]};
const PR={'1A':[60,R.a],'1B':[60,R.b],'2A':[100,R.c],'2B':[100,R.c],'2C':[120,R.d],'3A':[140,R.e],'3B':[140,R.e],'3C':[160,R.f],'4A':[180,R.g],'4B':[180,R.g],'4C':[200,R.h],'5A':[220,R.i],'5B':[220,R.i],'5C':[240,R.j],'6A':[260,R.k],'6B':[260,R.k],'6C':[280,R.l],'7A':[300,R.m],'7B':[300,R.m],'7C':[320,R.n],'8A':[350,R.o],'8B':[400,R.p]};
const HOUSE={1:50,2:50,3:100,4:100,5:150,6:150,7:200,8:200};
const KIND_TOPIC={pop:'POPQUIZ',real:'REALWORLD',jail:'REVISION',bonus:'BONUS'};

let BANK=JSON.parse(JSON.stringify(SAMPLE));
let BANKSRC='Built-in sample questions';
let S={phase:'setup',nTeams:4,minutes:BANK.settings.minutes||60,teams:[],cur:0,own:{},pot:0,dice:[1,1],msg:'',feed:[],log:[],used:new Set(),timeLeft:0,running:false,timeUp:false,q:null,kind:null,ctx:null,actA:[],actB:[],landed:null,busy:false};

const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=c=>BANK.names[c]||c;
const money=v=>'£'+Math.round(v).toLocaleString('en-GB');

function sqGeom(i){const w=WALLS[Math.floor(i/10)],k=i%10,sw=w.w/10;return {left:w.x+k*sw,width:sw}}
function label(i){const b=BOARD[i];if(b.t==='prop')return nm(b.c);if(b.t==='hub')return nm(b.c);if(b.t==='util')return nm(b.c);return ''}
function longLabel(i){const b=BOARD[i];if(b.t==='prop')return `Unit ${b.u} (${nm('U'+b.u)}): ${nm(b.c)}`;if(b.t==='hub')return `Skills hub: ${nm(b.c)}`;if(b.t==='util')return nm(b.c);return ''}
function price(i){const b=BOARD[i];return b.t==='prop'?PR[b.c][0]:b.t==='hub'?200:b.t==='util'?150:0}
function unitSquares(u){return BOARD.map((b,i)=>b.u===u?i:-1).filter(i=>i>=0)}
function ownsSet(team,u){return unitSquares(u).every(i=>S.own[i]&&S.own[i].team===team)}
function rent(i){const o=S.own[i],b=BOARD[i];
  if(b.t==='prop'){const r=PR[b.c][1];return o.houses?r[o.houses]:(ownsSet(o.team,b.u)?r[0]*2:r[0])}
  if(b.t==='hub'){const n=BOARD.filter((x,j)=>x.t==='hub'&&S.own[j]&&S.own[j].team===o.team).length;return [25,50,100,200][n-1]}
  const both=BOARD.every((x,j)=>x.t!=='util'||(S.own[j]&&S.own[j].team===o.team));return (S.dice[0]+S.dice[1])*(both?10:4)}
function catOf(i){const b=BOARD[i];return b.t==='prop'?'U'+b.u:b.t==='hub'?'HUB':b.c}
const CATS=['U1','U2','U3','U4','U5','U6','U7','U8','HUB','MATHS','ENGLISH','POP','REAL','BONUS'];
function catName(c){return c[0]==='U'&&c.length===2?`U${c[1]} ${nm(c)}`:{HUB:'Skills hubs',MATHS:'Maths',ENGLISH:'English',POP:'Pop quiz',REAL:'Real world',BONUS:'Bonus round'}[c]}

/* ---------- questions ---------- */
function pickQ(chain){
  for(const [topic,lvl] of chain){
    const pool=BANK.questions.filter(q=>q.topic===topic&&(lvl==null||q.level===lvl));
    if(!pool.length)continue;
    let fresh=pool.filter(q=>!S.used.has(q.id));
    if(!fresh.length){pool.forEach(q=>S.used.delete(q.id));fresh=pool}
    const q=fresh[rnd(fresh.length)];S.used.add(q.id);return q}
  return null}
function chainFor(i,lvl){const b=BOARD[i];
  if(b.t==='prop')return [[b.c,lvl],['U'+b.u,lvl],[b.c,null],['U'+b.u,null],['ANY',null]];
  if(b.t==='hub')return [[b.c,null],['HUB',null],['ANY',null]];
  return [[b.c,null],['ANY',null]]}
function teachBack(i){return {id:'teach'+i,q:`Teach it back! In 60 seconds, explain "${nm(BOARD[i].c)}" to the rest of the room.`,opts:[],ans:'',exp:'Tutor decides: was it clear and accurate? Other teams can help judge.'}}

/* ---------- game flow ---------- */
const act=(label,fn,cls='')=>({label,fn,cls});
function team(){return S.teams[S.cur]}
function setActs(a,b){S.actA=a||[];S.actB=b||[]}
function feed(t){S.feed.unshift(t);S.feed=S.feed.slice(0,12)}

function startGame(){
  S.teams=[];for(let k=0;k<S.nTeams;k++)S.teams.push({name:BANK.teams[k]||`Team ${k+1}`,color:TEAMCOL[k],money:BANK.settings.start||1500,pos:0,jail:false,jailTurns:0,ok:0,att:0});
  S.cur=0;S.own={};S.pot=0;S.feed=[];S.log=[];S.used=new Set();S.timeLeft=S.minutes*60;S.running=true;S.timeUp=false;S.phase='play';
  feed(`Game started: ${S.nTeams} teams, ${S.minutes} minutes. Good luck!`);
  buildBoard();startTurn()}

function startTurn(){
  S.q=null;S.kind=null;S.phase='play';const t=team();
  if(t.jail){S.msg=`${t.name} is in the Revision Room. Answer correctly to get out.`;setActs([act('Revision question',()=>ask('jail',{}),'alt')],[])}
  else{S.msg=`${t.name}, roll the dice!`;setActs([act('Roll dice',roll,'go')].concat(canBuild(S.cur)?[act('Build house',chooseBuild,'alt')]:[]),[])}
  render()}

function roll(){
  if(S.busy)return;S.busy=true;setActs([],[]);render();
  const d=[1+rnd(6),1+rnd(6)];let n=0;
  const spin=setInterval(()=>{S.dice=[1+rnd(6),1+rnd(6)];renderTurn();
    if(++n>9){clearInterval(spin);S.dice=d;S.msg=`${team().name} rolled ${d[0]+d[1]}`;renderTurn();setTimeout(()=>move(d[0]+d[1]),300)}},80)}

function move(steps){const t=team();
  const step=()=>{t.pos=(t.pos+1)%40;
    if(t.pos===0){const g=BANK.settings.go||200;t.money+=g;feed(`${t.name} passed GO: +${money(g)}`);burst(t.color)}
    renderBoardDyn();renderTeams();
    if(--steps>0)setTimeout(step,230);else{S.busy=false;land()}};
  step()}

function land(){const t=team(),i=t.pos,b=BOARD[i];S.landed=i;
  if(['prop','hub','util'].includes(b.t)){const o=S.own[i];
    if(!o){const p=price(i);S.msg=`${label(i)} is for sale at ${money(p)}. Answer correctly to buy it.`;
      setActs([t.money>=p?act(`Buy (${money(p)})`,()=>ask('buy',{i}),'go'):act(`Can't afford ${money(p)}`,()=>{},'off'),act('Pass',endTurn,'no')],[])}
    else if(o.team===S.cur){S.msg=`${t.name} owns ${label(i)}. Safe!`;endActs()}
    else{const r=rent(i),ow=S.teams[o.team];S.msg=`${label(i)} belongs to ${ow.name}. Rent is ${money(r)}. Pay, or challenge: right = pay nothing, wrong = pay double.`;
      setActs([act(`Pay rent (${money(r)})`,()=>{pay(S.cur,r,o.team);feed(`${t.name} paid ${money(r)} rent to ${ow.name}`);S.msg=`Paid ${money(r)} to ${ow.name}.`;endActs();render()},'alt'),act('Challenge',()=>ask('challenge',{i,r,to:o.team}),'go')],[])}}
  else if(b.t==='pop'||b.t==='real'||b.t==='bonus'){ask(b.t,{i});return}
  else if(b.t==='tax'){pay(S.cur,b.amt,'pot');S.msg=`Late submission fee! ${money(b.amt)} goes into the Bonus Round pot.`;feed(`${t.name} paid a ${money(b.amt)} late fee`);endActs()}
  else if(b.t==='gojail'){toJail(S.cur);S.msg=`${t.name} goes straight to the Revision Room!`;feed(S.msg);endActs()}
  else{S.msg=b.t==='go'?`${t.name} landed on GO.`:`${t.name} is just visiting the Revision Room.`;endActs()}
  render()}

function endActs(){setActs([act('End turn',endTurn)].concat(canBuild(S.cur)?[act('Build house',chooseBuild,'alt')]:[]),[])}

function pay(f,amt,to){const t=S.teams[f],paid=Math.min(amt,t.money);t.money-=paid;
  if(to==='pot')S.pot+=paid;else if(typeof to==='number')S.teams[to].money+=paid;
  if(paid<amt){feed(`${t.name} ran out of money! Off to the Revision Room to earn their way back.`);toJail(f)}}
function toJail(f){const t=S.teams[f];t.jail=true;t.jailTurns=0;t.pos=10;renderBoardDyn()}

function canBuild(k){const t=S.teams[k];if(!t||t.jail)return false;return buildable(k).length>0}
function buildable(k){const t=S.teams[k],out=[];
  for(let u=1;u<=8;u++){if(!ownsSet(k,u)||t.money<HOUSE[u])continue;unitSquares(u).forEach(i=>{if(S.own[i].houses<5)out.push(i)})}
  return out}
function chooseBuild(){const prev=S.actA;S.msg=`${team().name}: pick a property to build on. Each house means a harder question.`;
  setActs(buildable(S.cur).map(i=>act(`${label(i)} (${S.own[i].houses===4?'hotel':'house '+(S.own[i].houses+1)})`,()=>ask('house',{i}),'go')).concat([act('Cancel',()=>{setActs(prev,[]);render()},'no')]),[]);render()}

function ask(kind,ctx){S.kind=kind;S.ctx=ctx;let q=null;
  if(kind==='buy'||kind==='challenge')q=pickQ(chainFor(ctx.i,1));
  else if(kind==='house'){const h=S.own[ctx.i].houses;q=h>=4?teachBack(ctx.i):pickQ(chainFor(ctx.i,h<2?2:3))}
  else q=pickQ([[KIND_TOPIC[kind],null],['ANY',null]]);
  S.q=q||{id:'none',q:'No question found for this topic. Tutor: ask one out loud!',opts:[],ans:'',exp:''};
  S.revealed=false;S.chosen=null;S.phase='question';
  const titles={buy:`Buy ${label(ctx.i)}?`,challenge:`Rent challenge: ${label(ctx.i)}`,house:`Build on ${label(ctx.i)}`,pop:'Pop quiz! Correct = +£100',real:'Real world! Correct = +£150, wrong = −£75',jail:'Revision Room: answer to escape',bonus:`Bonus round! Open to everyone. Pot: ${money(S.pot+100)}`};
  S.qtitle=titles[kind];
  let b=[];
  if(kind==='bonus'){b=S.teams.map((tm,k)=>act(`${tm.name} wins`,()=>awardBonus(k),'go')).concat([act('No winner',()=>awardBonus(-1),'no')])}
  else{b=[act('✓ Correct',()=>judge(true),'go'),act('✗ Wrong',()=>judge(false),'no')];if(['buy','challenge','house'].includes(kind))b.push(act('Chicken out',chicken,'alt'))}
  if(!S.q.opts.length&&S.q.ans)b.unshift(act('Show answer',()=>{S.revealed=true;renderQ()},'alt'));
  S.msg=kind==='bonus'?'Every team can answer! Tutor picks who got it right first.':`${team().name}: answer the question on the front wall.`;
  setActs([],b);render()}

function chooseOpt(L){if(S.phase!=='question')return;S.chosen=L;
  if(S.kind==='bonus'){S.revealed=true;renderQ();return}
  judge(L===S.q.ans)}

function logAns(teamIdx,ok){const k=S.kind,c=S.ctx;const cat=['buy','challenge','house'].includes(k)?catOf(c.i):{pop:'POP',real:'REAL',bonus:'BONUS',jail:'REV'}[k];
  const t=S.teams[teamIdx];t.att++;if(ok)t.ok++;
  S.log.push({time:new Date().toLocaleTimeString('en-GB'),team:t.name,category:catName(cat)||'Revision',topic:c&&c.i!=null?longLabel(c.i):'',type:k,question:S.q.q,correct:ok?'Yes':'No',cat})}

function judge(ok){if(S.phase!=='question')return;const t=team(),k=S.kind,c=S.ctx;S.revealed=true;S.phase='result';logAns(S.cur,ok);let res='';
  if(k==='buy'){const p=price(c.i);if(ok){pay(S.cur,p,'bank');S.own[c.i]={team:S.cur,houses:0};res=`Correct! ${t.name} buys ${label(c.i)} for ${money(p)}.`;burst(t.color)}
    else{const pen=Math.round(p/2);pay(S.cur,pen,'pot');res=`Not quite. ${t.name} pays a ${money(pen)} penalty into the Bonus pot.`}}
  else if(k==='house'){const hc=HOUSE[BOARD[c.i].u];if(ok){pay(S.cur,hc,'bank');S.own[c.i].houses++;res=`Correct! ${S.own[c.i].houses===5?'Hotel':'House'} built on ${label(c.i)} for ${money(hc)}.`;burst(t.color)}
    else{const pen=Math.round(hc/2);pay(S.cur,pen,'pot');res=`Not quite. ${money(pen)} penalty into the Bonus pot.`}}
  else if(k==='challenge'){if(ok){res=`Challenge won! ${t.name} pays no rent.`;burst(t.color)}else{pay(S.cur,c.r*2,c.to);res=`Challenge lost. ${t.name} pays double rent: ${money(c.r*2)} to ${S.teams[c.to].name}.`}}
  else if(k==='pop'){if(ok){t.money+=100;res=`Correct! ${t.name} wins ${money(100)}.`;burst(t.color)}else res='Not this time. No reward.'}
  else if(k==='real'){if(ok){t.money+=150;res=`Great call! ${t.name} earns ${money(150)}.`;burst(t.color)}else{pay(S.cur,75,'pot');res=`Not the best choice. ${money(75)} into the Bonus pot.`}}
  else if(k==='jail'){if(ok){t.jail=false;let extra='';if(t.money<100){t.money+=100;extra=` Study grant: +${money(100)}.`}res=`Correct! ${t.name} escapes the Revision Room.${extra}`;burst(t.color)}
    else{t.jailTurns++;res=`Not yet. ${t.name} stays in the Revision Room.`;if(t.jailTurns>=3){t.jail=false;res+=' (Released after 3 turns.)'}}}
  feed(res);S.msg=res;
  if(k==='jail'&&ok)setActs([act('Roll dice',roll,'go')],[]);else endActs();
  render()}

function chicken(){if(S.phase!=='question')return;const t=team(),k=S.kind,c=S.ctx;S.revealed=true;S.phase='result';let res;
  if(k==='buy'){const pen=Math.round(price(c.i)/4);pay(S.cur,pen,'pot');res=`${t.name} chickened out! ${money(pen)} into the Bonus pot.`}
  else if(k==='house'){const pen=Math.round(HOUSE[BOARD[c.i].u]/4);pay(S.cur,pen,'pot');res=`${t.name} chickened out! ${money(pen)} into the Bonus pot.`}
  else{pay(S.cur,c.r,c.to);res=`${t.name} backed down and paid the normal rent: ${money(c.r)}.`}
  feed(res);S.msg=res;endActs();render()}

function awardBonus(k){if(S.phase!=='question')return;S.revealed=true;S.phase='result';let res;
  if(k>=0){const prize=S.pot+100;S.teams[k].money+=prize;logAns(k,true);res=`${S.teams[k].name} wins the Bonus Round: ${money(prize)}!`;S.pot=0;burst(S.teams[k].color)}
  else res='No winner. The pot keeps growing!';
  feed(res);S.msg=res;endActs();render()}

function endTurn(){if(S.busy)return;if(S.timeUp){endGame();return}S.cur=(S.cur+1)%S.teams.length;startTurn()}

function worth(k){let w=S.teams[k].money;for(const i in S.own){const o=S.own[i];if(o.team===k){w+=price(i);if(o.houses)w+=o.houses*HOUSE[BOARD[i].u]}}return w}
function accBonus(k){const t=S.teams[k];return t.att?Math.round(t.ok/t.att*500):0}
function endGame(){S.phase='end';S.running=false;
  S.final=S.teams.map((t,k)=>({k,name:t.name,worth:worth(k),bonus:accBonus(k)})).map(r=>({...r,total:r.worth+r.bonus})).sort((a,b)=>b.total-a.total);
  S.msg=`Game over! ${S.final[0].name} wins!`;feed(S.msg);burst(S.teams[S.final[0].k].color);burst('#ffd23f');
  setActs([act('New game',()=>{S.phase='setup';S.own={};S.landed=null;S.q=null;buildBoard();render()},'alt')],[]);render()}

      const t={go:['GO','Collect '+money(BANK.settings.go||200)+' as you pass'],jail:['Revision Room','Just visiting'],bonus:['Bonus Round','Pot: <span class="pot"></span>'],gojail:['Go to the Revision Room',''],pop:['Pop quiz','Correct = +£100'],real:['Real world','Workplace scenario'],tax:['Late fee','Pay '+money(b.amt||0)]}[b.t];

/* ---------- Excel loading (built-in reader, no internet needed) ---------- */
async function unzip(buf){const d=new DataView(buf),u8=new Uint8Array(buf),files={};let e=buf.byteLength-22;
  while(e>=0&&d.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Not an Excel file');
  let p=d.getUint32(e+16,true);const n=d.getUint16(e+10,true);const td=new TextDecoder();
  for(let k=0;k<n;k++){const method=d.getUint16(p+10,true),cs=d.getUint32(p+20,true),nl=d.getUint16(p+28,true),xl=d.getUint16(p+30,true),cl=d.getUint16(p+32,true),off=d.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    const ds=off+30+d.getUint16(off+26,true)+d.getUint16(off+28,true),raw=u8.slice(ds,ds+cs);
    files[name]={method,raw}}
  return async name=>{const f=files[name];if(!f)return null;
    if(f.method===0)return new TextDecoder().decode(f.raw);
    const s=new Blob([f.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(s).text()}}
async function readXlsx(buf){const get=await unzip(buf),X=t=>new DOMParser().parseFromString(t,'application/xml');
  const wb=X(await get('xl/workbook.xml')),rels=X(await get('xl/_rels/workbook.xml.rels'));
  const relMap={};[...rels.getElementsByTagName('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const ssx=await get('xl/sharedStrings.xml');const ss=ssx?[...X(ssx).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const col=r=>{let c=0;for(const ch of r.replace(/\d+/g,''))c=c*26+ch.charCodeAt(0)-64;return c-1};
  const out={};
  for(const sh of wb.getElementsByTagName('sheet')){let t=relMap[sh.getAttribute('r:id')]||'';t=t.startsWith('/')?t.slice(1):'xl/'+t;
    const x=await get(t);if(!x)continue;const grid=[];
    for(const row of X(x).getElementsByTagName('row')){const r=[];
      for(const c of row.getElementsByTagName('c')){const ty=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val='';
        if(ty==='s'&&v)val=ss[+v.textContent]||'';else if(ty==='inlineStr')val=[...c.getElementsByTagName('t')].map(z=>z.textContent).join('');else if(v)val=v.textContent;
        r[col(c.getAttribute('r'))]=val}
      grid[(+row.getAttribute('r')||grid.length+1)-1]=r}
    const head=(grid[0]||[]).map(h=>String(h||'').trim());
    out[sh.getAttribute('name').trim().toLowerCase()]=grid.slice(1).filter(Boolean).map(r=>{const o={};head.forEach((h,i)=>{if(h)o[h]=r[i]==null?'':r[i]});return o})}
  return out}
function parseWorkbook(sheets){
  const get=n=>sheets[n]||[];
  const out=JSON.parse(JSON.stringify(SAMPLE));
  get('settings').forEach(r=>{const k=String(r.Setting||'').trim().toLowerCase(),v=r.Value;
    if(k==='game name'&&String(v).trim())out.settings.name=String(v).trim();if(k==='starting money')out.settings.start=+v||1500;if(k==='go money')out.settings.go=+v||200;if(k==='minutes')out.settings.minutes=+v||60});
  get('teams').forEach((r,k)=>{const v=String(r['Team name']||'').trim();if(v&&k<6)out.teams[k]=v});
  get('names').forEach(r=>{const c=String(r.Code||'').trim().toUpperCase(),v=String(r.Name||'').trim();if(c&&v)out.names[c]=v});
  const qs=get('questions').filter(r=>String(r.Question||'').trim()).map((r,n)=>{
    const opts=['A','B','C','D'].map(L=>({L,text:String(r['Option '+L]||'').trim()})).filter(o=>o.text);
    let ans=String(r.Answer||'').trim();if(opts.length&&/^[a-d]$/i.test(ans))ans=ans.toUpperCase();
    return {id:'x'+n,topic:String(r.Topic||'ANY').trim().toUpperCase()||'ANY',level:parseInt(r.Level)||1,q:String(r.Question).trim(),opts,ans,exp:String(r.Explanation||'').trim()}});
  if(qs.length)out.questions=qs;
  return out}
async function useWorkbook(buf,src){try{BANK=parseWorkbook(await readXlsx(buf));BANKSRC=src;S.minutes=BANK.settings.minutes||S.minutes;buildBoard();render()}
  catch(e){console.warn(e);BANKSRC='Could not read that file (is it .xlsx?). Still using the previous questions.';render()}}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>useWorkbook(r.result,'Loaded: '+f.name);r.readAsArrayBuffer(f);e.target.value=''};
(function autoLoad(){if(!/^https?:/.test(location.protocol))return;
  const url=new URLSearchParams(location.search).get('q')||'questions.xlsx';
  fetch(url,{cache:'no-store'}).then(r=>r.ok?r.arrayBuffer():null).then(b=>{if(b&&S.phase==='setup')useWorkbook(b,'Loaded from '+url.split('/').pop())}).catch(()=>{})})();

/* ---------- floor ambience ---------- */
const cv=$('floorcv'),cx=cv.getContext('2d');const bubbles=[],parts=[];
for(let i=0;i<55;i++)bubbles.push({x:Math.random()*2847,y:Math.random()*3436,r:40+Math.random()*140,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,c:UNITCOL[1+rnd(8)]});
function burst(c){for(let i=0;i<140;i++){const a=Math.random()*6.283,s=8+Math.random()*26;parts.push({x:1423,y:1718,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:14+Math.random()*26,c,life:100})}}
(function loop(){cx.fillStyle='#0d1530';cx.fillRect(0,0,2847,3436);
  cx.globalAlpha=.22;bubbles.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<-200)b.x=3047;if(b.x>3047)b.x=-200;if(b.y<-200)b.y=3636;if(b.y>3636)b.y=-200;cx.fillStyle=b.c;cx.beginPath();cx.arc(b.x,b.y,b.r,0,6.283);cx.fill()});
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life--;cx.globalAlpha=Math.max(p.life/100,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();if(p.life<=0)parts.splice(i,1)}
  cx.globalAlpha=1;requestAnimationFrame(loop)})();

/* ---------- scale to window ---------- */
function scaleStage(){const native=new URLSearchParams(location.search).has('native');const s=native?1:Math.min(innerWidth/12566,innerHeight/4516);$('stage').style.transform=`scale(${s})`}
addEventListener('resize',scaleStage);scaleStage();
buildBoard();render();
