name: Fetch generated audio
on:
  push:
    paths: ['tools/audio-manifest.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download clips listed in the manifest
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          m = json.load(open('tools/audio-manifest.json'))
          os.makedirs('assets/audio', exist_ok=True)
          ok = 0
          for name, url in m.items():
              try:
                  urllib.request.urlretrieve(url, f'assets/audio/{name}.mp3'); ok += 1
              except Exception as e:
                  print('FAILED', name, e)
          print(f'{ok}/{len(m)} downloaded')
          PY
          echo '{}' > tools/audio-manifest.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio tools/audio-manifest.json
          git commit -m "Add generated audio clips" || echo "nothing to commit"
          git push
